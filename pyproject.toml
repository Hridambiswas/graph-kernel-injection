[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-kernel-injection"
version = "0.1.0"
description = "Automated graph-level kernel injection for long-context LLMs — PyTorch FX pass + block-sparse Triton Flash-Attention."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Hridam Biswas", email = "hridambiswas2005@gmail.com" },
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.3",
    "triton>=2.3",
    "numpy>=1.24",
]
keywords = ["ml-compilers", "triton", "flash-attention", "pytorch-fx", "long-context", "sparse-attention"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = false
disallow_untyped_decorators = false
ignore_missing_imports = true
